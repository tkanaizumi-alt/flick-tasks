<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flick" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Flick</title>
    <style>
      /* 初回描画用の最小スタイル (JS 読込前にメモ入力とスケルトンを出す) */
      :root {
        --bg: #f6f7fb;
        --ink: #0c0f17;
        --ink-2: rgba(12, 15, 23, 0.56);
        --ink-3: rgba(12, 15, 23, 0.32);
        --glass: linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.38));
        --glass-edge: inset 0 1px 1px rgba(255, 255, 255, 0.95), inset 0 -1px 1px rgba(255, 255, 255, 0.45),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.6), 0 1px 2px rgba(20, 28, 48, 0.04), 0 14px 36px -10px rgba(20, 28, 48, 0.16);
        --composer-h: 64px;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; color: var(--ink); }
      html { background: var(--bg); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Segoe UI', 'Yu Gothic UI', Meiryo, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: none;
        overflow-x: hidden;
      }
      .composer {
        position: fixed; z-index: 40;
        top: calc(var(--safe-t) + 12px); left: 12px; right: 12px;
        max-width: 640px; margin: 0 auto;
        display: flex; align-items: flex-end; gap: 6px;
        padding: 8px 8px 8px 18px;
        border-radius: 26px;
        background: var(--glass);
        -webkit-backdrop-filter: blur(28px) saturate(190%);
        backdrop-filter: blur(28px) saturate(190%);
        box-shadow: var(--glass-edge);
        transition: box-shadow 0.35s ease, transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3);
      }
      .composer:focus-within {
        box-shadow: var(--glass-edge), 0 0 0 4px rgba(120, 140, 255, 0.14), 0 18px 44px -12px rgba(90, 110, 255, 0.28);
      }
      .composer.pop { animation: composer-pop 0.42s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
      @keyframes composer-pop { 0% { transform: scale(1); } 35% { transform: scale(0.97); } 100% { transform: scale(1); } }
      .composer textarea {
        flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent;
        font: inherit; font-size: 17px; line-height: 24px; color: var(--ink);
        padding: 10px 0; margin: 0; height: 44px; max-height: 160px;
        caret-color: #5b6cff;
        scrollbar-width: none;
      }
      .composer textarea::-webkit-scrollbar { display: none; }
      .composer textarea::placeholder { color: var(--ink-3); }
      .composer .cbtn {
        flex: none; width: 40px; height: 40px; margin-bottom: 2px; border-radius: 50%; border: 0; padding: 0;
        display: grid; place-items: center; cursor: pointer; color: var(--ink);
        background: rgba(255, 255, 255, 0.6);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 1), 0 1px 3px rgba(20, 28, 48, 0.08);
        transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.5), opacity 0.25s ease, background 0.25s ease;
      }
      .composer .cbtn:active { transform: scale(0.86); }
      .composer .cbtn svg { width: 20px; height: 20px; }
      .composer #send-btn { background: linear-gradient(160deg, #6f7dff, #4f5bff); color: #fff; box-shadow: 0 6px 16px -4px rgba(79, 91, 255, 0.55), inset 0 1px 1px rgba(255,255,255,.5); }
      .composer:not(.has-text) #send-btn { transform: scale(0.4); opacity: 0; pointer-events: none; width: 0; margin-left: -6px; }
      .composer:not(.has-text) #ai-btn { opacity: 0.55; }
      .composer.ai-busy #ai-btn svg { animation: spin 1.1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .boot-skel { position: fixed; inset: 0; padding: calc(var(--safe-t) + var(--composer-h) + 28px) 12px 0; }
      .skel-list { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
      .skel {
        position: relative; overflow: hidden; border-radius: 22px;
        background: rgba(255, 255, 255, 0.55);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9), 0 1px 2px rgba(20, 28, 48, 0.04);
      }
      .skel::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.9) 45%, rgba(225, 230, 255, 0.6) 55%, transparent 80%);
        transform: translateX(-100%);
        animation: shimmer 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .skel-card { height: 68px; display: flex; align-items: center; gap: 14px; padding: 0 18px; }
      .skel-line { height: 12px; border-radius: 6px; background: rgba(20, 28, 48, 0.07); }
      .skel-dot { width: 22px; height: 22px; border-radius: 50%; background: rgba(20, 28, 48, 0.07); flex: none; }
      .skel-tabbar {
        position: fixed; left: 50%; bottom: calc(var(--safe-b) + 16px); transform: translateX(-50%);
        width: min(calc(100% - 24px), 420px); height: 62px; border-radius: 31px;
      }
      @keyframes shimmer { to { transform: translateX(100%); } }
      .bg-plain { position: fixed; inset: 0; z-index: -1; background:
        radial-gradient(60% 40% at 10% 0%, rgba(170, 190, 255, 0.28), transparent 70%),
        radial-gradient(50% 40% at 100% 30%, rgba(230, 200, 255, 0.24), transparent 70%),
        radial-gradient(60% 40% at 30% 100%, rgba(180, 240, 225, 0.24), transparent 70%), var(--bg); }
    </style>
  </head>
  <body>
    <div class="bg-plain" aria-hidden="true"></div>

    <div id="composer" class="composer">
      <textarea id="memo" rows="1" placeholder="メモ" autofocus enterkeyhint="send" aria-label="メモ" autocomplete="off"></textarea>
      <button id="ai-btn" class="cbtn" type="button" aria-label="AIで整理">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
      </button>
      <button id="send-btn" class="cbtn" type="button" aria-label="追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>

    <div id="root">
      <div class="boot-skel" aria-busy="true" aria-label="読み込み中">
        <div class="skel-list">
          <div class="skel skel-card"><div class="skel-dot"></div><div class="skel-line" style="width:62%"></div></div>
          <div class="skel skel-card"><div class="skel-dot"></div><div class="skel-line" style="width:44%"></div></div>
          <div class="skel skel-card"><div class="skel-dot"></div><div class="skel-line" style="width:71%"></div></div>
          <div class="skel skel-card"><div class="skel-dot"></div><div class="skel-line" style="width:38%"></div></div>
          <div class="skel skel-card"><div class="skel-dot"></div><div class="skel-line" style="width:56%"></div></div>
          <div class="skel skel-card"><div class="skel-dot"></div><div class="skel-line" style="width:48%"></div></div>
        </div>
        <div class="skel skel-tabbar"></div>
      </div>
    </div>

    <script>
      // React 読込前から即メモできるよう、入力は素の DOM で扱い localStorage のキューに積む
      ;(function () {
        var KEY = 'flick.pending'
        var ta = document.getElementById('memo')
        var comp = document.getElementById('composer')
        function read() { try { return JSON.parse(localStorage.getItem(KEY) || '[]') } catch (e) { return [] } }
        function write(q) { try { localStorage.setItem(KEY, JSON.stringify(q)) } catch (e) {} }
        function uid() { return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12) }
        function grow() {
          ta.style.height = 'auto'
          ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'
          comp.classList.toggle('has-text', !!ta.value.trim())
        }
        function submit(ai) {
          var v = ta.value.trim()
          if (!v) return
          var q = read()
          q.push({ id: uid(), title: v, ai: !!ai, at: Date.now() })
          write(q)
          ta.value = ''
          grow()
          comp.classList.remove('pop'); void comp.offsetWidth; comp.classList.add('pop')
          window.dispatchEvent(new Event('flick:pending'))
        }
        ta.addEventListener('input', grow)
        ta.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(false) }
        })
        ;['send-btn', 'ai-btn'].forEach(function (id) {
          var b = document.getElementById(id)
          // ボタン押下でテキストエリアのフォーカス (モバイルのキーボード) を失わない
          b.addEventListener('pointerdown', function (e) { e.preventDefault() })
          b.addEventListener('click', function () { submit(id === 'ai-btn') })
        })
        if (window.ResizeObserver) new ResizeObserver(function () {
          document.documentElement.style.setProperty('--composer-h', comp.offsetHeight + 'px')
        }).observe(comp)
        ta.focus()
        window.__flick = { key: KEY, read: read, write: write }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
