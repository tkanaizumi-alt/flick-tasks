<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6.25 120 120">
  <!-- スキン「大男」: もじゃもじゃ頭・ハチマキの陽気な大男の顔。絵文字に合わせた、ぷっくりした立体風のタッチ -->
  <defs>
    <radialGradient id="hair" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#6b4a36"/>
      <stop offset="0.55" stop-color="#3f2a1f"/>
      <stop offset="1" stop-color="#2a1b14"/>
    </radialGradient>
    <radialGradient id="face" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f6c99a"/>
      <stop offset="0.6" stop-color="#e3a46f"/>
      <stop offset="1" stop-color="#c98653"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b93a3"/>
      <stop offset="1" stop-color="#565d6b"/>
    </linearGradient>
    <radialGradient id="beard" cx="50%" cy="20%" r="85%">
      <stop offset="0" stop-color="#6b4a36"/>
      <stop offset="1" stop-color="#3a271c"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8f7a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff8f7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- もじゃもじゃの髪 (ふわっと丸く) -->
  <g fill="url(#hair)">
    <circle cx="60" cy="33" r="15"/>
    <circle cx="44" cy="36" r="13"/>
    <circle cx="76" cy="36" r="13"/>
    <circle cx="33" cy="48" r="12"/>
    <circle cx="87" cy="48" r="12"/>
    <circle cx="31" cy="62" r="10"/>
    <circle cx="89" cy="62" r="10"/>
    <circle cx="35" cy="74" r="8"/>
    <circle cx="85" cy="74" r="8"/>
  </g>
  <!-- 髪のつや -->
  <g fill="#ffffff" opacity="0.18">
    <ellipse cx="54" cy="27" rx="6" ry="3"/>
    <ellipse cx="40" cy="31" rx="4.5" ry="2.4"/>
    <ellipse cx="28" cy="44" rx="3.5" ry="2"/>
  </g>

  <!-- 耳 -->
  <circle cx="37" cy="64" r="5" fill="#d9965f"/>
  <circle cx="83" cy="64" r="5" fill="#d9965f"/>

  <!-- 顔 -->
  <circle cx="60" cy="64" r="24" fill="url(#face)"/>
  <!-- 顔のつや -->
  <ellipse cx="51" cy="54" rx="9" ry="5" fill="#ffffff" opacity="0.22"/>

  <!-- ハチマキ -->
  <path d="M36 52 Q60 42 84 52 L84 58 Q60 49 36 58 Z" fill="url(#band)"/>
  <path d="M38 52.5 Q60 44 82 52.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M84 53 q8 -3 11 -1 q-2 3 -1 6 q-5 0 -10 -1 Z" fill="url(#band)"/>

  <!-- 眉 -->
  <path d="M45 61 q5 -3.5 10 -1" fill="none" stroke="#3a271c" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M65 60 q5 -2.5 10 1" fill="none" stroke="#3a271c" stroke-width="3.2" stroke-linecap="round"/>

  <!-- 目 -->
  <ellipse cx="51" cy="67" rx="3.2" ry="3.8" fill="#2b1d16"/>
  <ellipse cx="69" cy="67" rx="3.2" ry="3.8" fill="#2b1d16"/>
  <circle cx="52.1" cy="65.6" r="1.1" fill="#fff"/>
  <circle cx="70.1" cy="65.6" r="1.1" fill="#fff"/>

  <!-- ほっぺ -->
  <circle cx="44" cy="73" r="5" fill="url(#cheek)"/>
  <circle cx="76" cy="73" r="5" fill="url(#cheek)"/>

  <!-- あごひげ (丸く) と笑った口 -->
  <path d="M42 74 Q44 89 60 90 Q76 89 78 74 Q72 80 66 78 Q60 76 54 78 Q48 80 42 74 Z" fill="url(#beard)"/>
  <path d="M52 77 Q60 85 68 77 Q60 79.5 52 77 Z" fill="#8a3b2b"/>
  <path d="M53.2 77.6 Q60 79.6 66.8 77.6 L66 79 Q60 80.6 54 79 Z" fill="#fff"/>
</svg>
