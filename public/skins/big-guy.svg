<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17 -30 154 154">
  <!-- スキン「大男」: もじゃもじゃ頭・ハチマキの陽気な大男の顔 (デフォルメ) -->
  <defs>
    <radialGradient id="skin" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#d89566"/>
      <stop offset="1" stop-color="#a8673f"/>
    </radialGradient>
  </defs>

  <!-- もじゃもじゃの髪 (後ろ) -->
  <g fill="#2b221d">
    <circle cx="60" cy="24" r="17"/>
    <circle cx="40" cy="28" r="15"/>
    <circle cx="80" cy="28" r="15"/>
    <circle cx="26" cy="42" r="13"/>
    <circle cx="94" cy="42" r="13"/>
    <circle cx="22" cy="58" r="11"/>
    <circle cx="98" cy="58" r="11"/>
    <circle cx="27" cy="72" r="9"/>
    <circle cx="93" cy="72" r="9"/>
    <circle cx="48" cy="16" r="11"/>
    <circle cx="72" cy="16" r="11"/>
  </g>
  <!-- 髪のつや -->
  <g fill="none" stroke="#4a3b33" stroke-width="2" stroke-linecap="round">
    <path d="M44 20 q4 -4 8 0"/>
    <path d="M66 18 q4 -4 8 0"/>
    <path d="M26 40 q3 -3 6 0"/>
    <path d="M88 40 q3 -3 6 0"/>
  </g>

  <!-- 耳 -->
  <circle cx="31" cy="58" r="6" fill="#b97a4f"/>
  <circle cx="89" cy="58" r="6" fill="#b97a4f"/>
  <circle cx="31" cy="65" r="2.2" fill="#f0c04a"/>
  <circle cx="89" cy="65" r="2.2" fill="#f0c04a"/>

  <!-- 顔 -->
  <ellipse cx="60" cy="56" rx="29" ry="28" fill="url(#skin)"/>

  <!-- ハチマキ -->
  <path d="M30 42 C40 36 80 36 90 42 L90 50 C80 45 40 45 30 50 Z" fill="#4b4f58"/>
  <path d="M30 44 C40 38 80 38 90 44" fill="none" stroke="#6a707b" stroke-width="1.5"/>
  <path d="M90 44 l12 -4 l-3 7 l6 4 l-13 0 Z" fill="#4b4f58"/>

  <!-- 太い眉 -->
  <path d="M41 52 q7 -5 14 -1" fill="none" stroke="#2b221d" stroke-width="4" stroke-linecap="round"/>
  <path d="M65 51 q7 -4 14 1" fill="none" stroke="#2b221d" stroke-width="4" stroke-linecap="round"/>

  <!-- 目 (にっこり) -->
  <ellipse cx="48" cy="59" rx="3.4" ry="4" fill="#1d1714"/>
  <ellipse cx="72" cy="59" rx="3.4" ry="4" fill="#1d1714"/>
  <circle cx="49.2" cy="57.6" r="1.2" fill="#fff"/>
  <circle cx="73.2" cy="57.6" r="1.2" fill="#fff"/>

  <!-- ほっぺ -->
  <ellipse cx="40" cy="67" rx="5" ry="3" fill="#e9876b" opacity="0.55"/>
  <ellipse cx="80" cy="67" rx="5" ry="3" fill="#e9876b" opacity="0.55"/>

  <!-- 鼻 -->
  <path d="M57 64 q3 3 6 0" fill="none" stroke="#7d4628" stroke-width="2" stroke-linecap="round"/>

  <!-- あごひげ (口のまわりを空けて) -->
  <path d="M36 66 C38 80 48 86 60 86 C72 86 82 80 84 66 C80 72 74 74 70 72 C66 70 54 70 50 72 C46 74 40 72 36 66 Z" fill="#2b221d"/>

  <!-- ニカッと笑う口 -->
  <path d="M49 72 C52 80 68 80 71 72 Z" fill="#7a2e22"/>
  <path d="M50 72.5 C55 75 65 75 70 72.5 L69.2 74 C64 76 56 76 50.8 74 Z" fill="#fff"/>
</svg>
